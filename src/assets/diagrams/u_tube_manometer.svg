<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="manometerFluidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="gasBulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glassTubeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <g transform="translate(450, 40)" text-anchor="middle">
    <text fill="#38bdf8" font-size="24" font-weight="800" letter-spacing="1">ICSE CLASS 7 PHYSICS: FORCES &amp; PRESSURE</text>
    <text y="25" fill="#94a3b8" font-size="15" font-weight="500">Open-Tube Liquid Manometer (Hydrostatic Pressure Measurement)</text>
  </g>

  <!-- Left Side: Gas Supply Bulb / Reservoir -->
  <g transform="translate(180, 260)">
    <!-- Gas Supply Flask -->
    <ellipse cx="-40" cy="80" rx="65" ry="65" fill="url(#gasBulbGrad)" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)" />
    <!-- Gas Molecules dots -->
    <g fill="#93c5fd" opacity="0.8">
      <circle cx="-65" cy="60" r="3.5" /><circle cx="-30" cy="50" r="3.5" />
      <circle cx="-50" cy="95" r="3.5" /><circle cx="-15" cy="85" r="3.5" />
      <circle cx="-60" cy="115" r="3.5" /><circle cx="-35" cy="110" r="3.5" />
      <circle cx="-75" cy="80" r="3.5" /><circle cx="-20" cy="120" r="3.5" />
    </g>
    <!-- Label inside flask -->
    <text x="-40" y="75" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">GAS RESERVOIR</text>
    <text x="-40" y="93" fill="#bfdbfe" font-size="12" font-weight="600" text-anchor="middle">Pressure = P</text>

    <!-- Connecting neck and stopcock valve -->
    <path d="M 25 80 L 120 80" stroke="#93c5fd" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M 25 80 L 120 80" stroke="#0f172a" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Stopcock Valve Handle -->
    <rect x="65" y="55" width="12" height="50" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
    <ellipse cx="71" cy="55" rx="14" ry="5" fill="#fbbf24" />
    <text x="71" y="45" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">VALVE (OPEN)</text>

    <!-- Pressure arrows into left arm -->
    <path d="M 90 80 L 125 80" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="75" y="115" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">P &gt; P₀</text>
  </g>

  <!-- Central U-Tube Assembly -->
  <!-- Left arm x: 300 to 340 (center 320), Right arm x: 440 to 480 (center 460) -->
  <g transform="translate(60, 0)">
    <!-- Wooden Stand / Backboard -->
    <rect x="255" y="120" width="270" height="560" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />

    <!-- Measurement Scale Ruler (between limbs) -->
    <g transform="translate(380, 150)">
      <rect x="0" y="0" width="30" height="480" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <!-- Scale markings -->
      <g stroke="#64748b" stroke-width="1">
        <!-- Major ticks & numbers (every 40px = 5cm) -->
        <line x1="0" y1="20" x2="12" y2="20" /><text x="16" y="24" fill="#94a3b8" font-size="9" font-family="monospace">25</text>
        <line x1="0" y1="60" x2="12" y2="60" /><text x="16" y="64" fill="#94a3b8" font-size="9" font-family="monospace">20</text>
        <line x1="0" y1="100" x2="12" y2="100" /><text x="16" y="104" fill="#94a3b8" font-size="9" font-family="monospace">15</text>
        <line x1="0" y1="140" x2="12" y2="140" /><text x="16" y="144" fill="#94a3b8" font-size="9" font-family="monospace">10</text>
        <line x1="0" y1="180" x2="12" y2="180" /><text x="16" y="184" fill="#94a3b8" font-size="9" font-family="monospace">5</text>
        <line x1="0" y1="220" x2="12" y2="220" /><text x="16" y="224" fill="#38bdf8" font-size="9" font-family="monospace" font-weight="bold">0</text>
        <line x1="0" y1="260" x2="12" y2="260" /><text x="16" y="264" fill="#94a3b8" font-size="9" font-family="monospace">5</text>
        <line x1="0" y1="300" x2="12" y2="300" /><text x="16" y="304" fill="#94a3b8" font-size="9" font-family="monospace">10</text>
        <line x1="0" y1="340" x2="12" y2="340" /><text x="16" y="344" fill="#94a3b8" font-size="9" font-family="monospace">15</text>
        <line x1="0" y1="380" x2="12" y2="380" /><text x="16" y="384" fill="#94a3b8" font-size="9" font-family="monospace">20</text>
        <line x1="0" y1="420" x2="12" y2="420" /><text x="16" y="424" fill="#94a3b8" font-size="9" font-family="monospace">25</text>
        <line x1="0" y1="460" x2="12" y2="460" /><text x="16" y="464" fill="#94a3b8" font-size="9" font-family="monospace">30</text>
        <!-- Minor ticks -->
        <line x1="0" y1="40" x2="6" y2="40" stroke="#334155" />
        <line x1="0" y1="80" x2="6" y2="80" stroke="#334155" />
        <line x1="0" y1="120" x2="6" y2="120" stroke="#334155" />
        <line x1="0" y1="160" x2="6" y2="160" stroke="#334155" />
        <line x1="0" y1="200" x2="6" y2="200" stroke="#334155" />
        <line x1="0" y1="240" x2="6" y2="240" stroke="#334155" />
        <line x1="0" y1="280" x2="6" y2="280" stroke="#334155" />
        <line x1="0" y1="320" x2="6" y2="320" stroke="#334155" />
        <line x1="0" y1="360" x2="6" y2="360" stroke="#334155" />
        <line x1="0" y1="400" x2="6" y2="400" stroke="#334155" />
        <line x1="0" y1="440" x2="6" y2="440" stroke="#334155" />
      </g>
      <text x="15" y="-8" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">cm</text>
    </g>

    <!-- Glass U-Tube Outer & Inner Outline -->
    <!-- Left limb x=290-330 (width 40), Right limb x=450-490 (width 40), Bottom curve connects y=600 -->
    <!-- Background of empty tube -->
    <path d="M 290 200 L 290 570 C 290 640 490 640 490 570 L 490 140 L 450 140 L 450 570 C 450 605 330 605 330 570 L 330 200 Z" 
          fill="#0f172a" stroke="#475569" stroke-width="2" />

    <!-- Liquid Column Inside U-Tube -->
    <!-- Left column meniscus is at y=480 (Depressed by gas pressure) -->
    <!-- Right column meniscus is at y=230 (Elevated) -->
    <path d="M 291 480 
             L 291 570 
             C 291 639 489 639 489 570 
             L 489 230 
             L 451 230 
             L 451 570 
             C 451 604 329 604 329 570 
             L 329 480 
             Z" 
          fill="url(#manometerFluidGrad)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Meniscus Left (Concave downwards at level h1 = 480) -->
    <path d="M 291 480 Q 310 488 329 480" fill="none" stroke="#e0f2fe" stroke-width="2.5" />
    <ellipse cx="310" cy="483" rx="19" ry="3" fill="#0284c7" fill-opacity="0.5" />

    <!-- Meniscus Right (Concave downwards at level h2 = 230) -->
    <path d="M 451 230 Q 470 238 489 230" fill="none" stroke="#e0f2fe" stroke-width="2.5" />
    <ellipse cx="470" cy="233" rx="19" ry="3" fill="#0284c7" fill-opacity="0.5" />

    <!-- Glass Reflection Sheen on U-tube -->
    <path d="M 295 200 L 295 570 C 295 630 485 630 485 570 L 485 150" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />

    <!-- Atmospheric Pressure Downward Arrows at Open Right Arm -->
    <g transform="translate(470, 80)">
      <text x="0" y="0" fill="#f87171" font-size="14" font-weight="800" text-anchor="middle">P₀ (Atmospheric)</text>
      <path d="M 0 10 L 0 50" stroke="#f87171" stroke-width="2.5" />
      <polygon points="0,55 -5,45 5,45" fill="#f87171" />
      <path d="M -12 15 L -12 45" stroke="#f87171" stroke-width="1.5" />
      <polygon points="-12,50 -15,42 -9,42" fill="#f87171" />
      <path d="M 12 15 L 12 45" stroke="#f87171" stroke-width="1.5" />
      <polygon points="12,50 9,42 15,42" fill="#f87171" />
    </g>

    <!-- Isobaric Datum Line (Same horizontal line at left meniscus level y=480) -->
    <line x1="260" y1="480" x2="520" y2="480" stroke="#facc15" stroke-width="2" stroke-dasharray="6,4" />
    <!-- Datum points A and B -->
    <circle cx="310" cy="480" r="5" fill="#facc15" stroke="#0f172a" stroke-width="1.5" />
    <text x="310" y="505" fill="#fef08a" font-size="13" font-weight="800" text-anchor="middle">Point A</text>
    
    <circle cx="470" cy="480" r="5" fill="#facc15" stroke="#0f172a" stroke-width="1.5" />
    <text x="470" y="505" fill="#fef08a" font-size="13" font-weight="800" text-anchor="middle">Point B</text>

    <!-- Height Difference Delta h Dimension Line -->
    <g transform="translate(515, 0)">
      <!-- Top reference extension line -->
      <line x1="-25" y1="230" x2="35" y2="230" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
      <!-- Bottom reference extension line -->
      <line x1="-25" y1="480" x2="35" y2="480" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
      <!-- Vertical dimension arrow -->
      <line x1="25" y1="235" x2="25" y2="475" stroke="#38bdf8" stroke-width="2.5" />
      <polygon points="25,230 20,242 30,242" fill="#38bdf8" />
      <polygon points="25,480 20,468 30,468" fill="#38bdf8" />
      <!-- Dimension text -->
      <rect x="35" y="340" width="105" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="87" y="358" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">Δh = h₂ - h₁</text>
      <text x="87" y="374" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Liquid Height Diff</text>
    </g>
  </g>

  <!-- FORMULA & DERIVATION CALLOUT BOX (Bottom Center-Right) -->
  <g transform="translate(560, 520)">
    <rect width="310" height="280" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="310" height="38" rx="10" fill="#0284c7" />
    <text x="155" y="24" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.5">HYDROSTATIC FORMULA</text>

    <!-- Derivation Steps -->
    <g transform="translate(18, 55)" font-size="12" fill="#e2e8f0">
      <text y="10" font-weight="700" fill="#facc15">At Datum Line (Equal Level):</text>
      <text y="30" font-family="monospace" font-size="13" fill="#ffffff">Pressure at A = Pressure at B</text>
      
      <text y="60" font-weight="700" fill="#93c5fd">1. Pressure at A (Left arm):</text>
      <text y="78" font-family="monospace" font-size="13" fill="#ffffff">   P_A = P_gas</text>

      <text y="105" font-weight="700" fill="#f87171">2. Pressure at B (Right arm):</text>
      <text y="123" font-family="monospace" font-size="13" fill="#ffffff">   P_B = P₀ + ρ · g · Δh</text>

      <!-- Equated result -->
      <line x1="0" y1="140" x2="275" y2="140" stroke="#475569" stroke-width="1.5" />
      <rect x="0" y="150" width="275" height="42" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" />
      <text x="137" y="176" fill="#4ade80" font-size="16" font-weight="900" text-anchor="middle" font-family="monospace">P = P₀ + ρgΔh</text>

      <text y="210" font-size="11" fill="#94a3b8">ρ (rho) = Density of manometric fluid</text>
      <text y="224" font-size="11" fill="#94a3b8">g = Acceleration due to gravity (9.8 m/s²)</text>
    </g>
  </g>

  <!-- MENISCUS DETAIL INSET BOX (Bottom Left) -->
  <g transform="translate(40, 520)">
    <rect width="270" height="280" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="270" height="38" rx="10" fill="#b45309" />
    <text x="135" y="24" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">MENISCUS READING GUIDE</text>
    
    <!-- Zoom Circle -->
    <g transform="translate(70, 115)">
      <circle cx="65" cy="40" r="45" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
      <!-- Water tube zoomed -->
      <path d="M 30 10 L 30 70 L 100 70 L 100 10 Z" fill="#0284c7" fill-opacity="0.3" />
      <!-- Concave curve -->
      <path d="M 30 40 Q 65 58 100 40 L 100 70 L 30 70 Z" fill="url(#manometerFluidGrad)" />
      <path d="M 30 40 Q 65 58 100 40" fill="none" stroke="#fde047" stroke-width="3" />
      
      <!-- Correct reading tangent line -->
      <line x1="20" y1="49" x2="110" y2="49" stroke="#4ade80" stroke-width="2" stroke-dasharray="3,2" />
      <circle cx="65" cy="49" r="3" fill="#4ade80" />
      <!-- Eye position -->
      <path d="M 120 49 Q 130 43 140 49 Q 130 55 120 49 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
      <circle cx="130" cy="49" r="2.5" fill="#0284c7" />
    </g>

    <g transform="translate(15, 205)" font-size="11" fill="#cbd5e1">
      <text y="10" font-weight="700" fill="#4ade80">✓ Correct (Water):</text>
      <text y="24">Read at the BOTTOM of concave curve.</text>
      <text y="42" font-weight="700" fill="#f87171">✗ Parallax Error:</text>
      <text y="56">Eye MUST be strictly level with meniscus.</text>
    </g>
  </g>
</svg>
