<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 900" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="glassWallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="silverInnerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="stopperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title Header -->
  <g transform="translate(425, 45)" text-anchor="middle">
    <text fill="#38bdf8" font-size="24" font-weight="800" letter-spacing="1">ICSE CLASS 7 PHYSICS: HEAT TRANSFER</text>
    <text y="25" fill="#94a3b8" font-size="15" font-weight="500">Working Construction of a Thermos / Vacuum Flask</text>
  </g>

  <!-- Main Vessel Group -->
  <g transform="translate(380, 100)">
    <!-- Outer Plastic/Metal Casing Shadow -->
    <rect x="-140" y="100" width="280" height="570" rx="35" fill="none" stroke="#0f172a" stroke-width="6" filter="url(#dropShadow)" />

    <!-- Outer Protective Casing -->
    <rect x="-140" y="100" width="280" height="570" rx="35" fill="url(#casingGrad)" stroke="#64748b" stroke-width="2" />
    <rect x="-130" y="115" width="260" height="540" rx="28" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Cork / Plastic Insulated Stopper -->
    <path d="M -50 40 L 50 40 L 40 120 L -40 120 Z" fill="url(#stopperGrad)" stroke="#b45309" stroke-width="2" filter="url(#dropShadow)"/>
    <ellipse cx="0" cy="40" rx="50" ry="12" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
    <!-- Stopper Cap Top -->
    <rect x="-65" y="15" width="130" height="28" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <text x="0" y="34" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">SCREW CAP</text>

    <!-- Double-Walled Glass Vessel Outer Wall -->
    <path d="M -95 125 
             C -95 125 -105 170 -105 220 
             L -105 580 
             C -105 625 -65 645 0 645 
             C 65 645 105 625 105 580 
             L 105 220 
             C 105 170 95 125 95 125 
             Z" 
          fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="3" />

    <!-- Vacuum Annular Space (Gap between walls) -->
    <!-- Inner Wall (Inside Double-Walled Glass) -->
    <path d="M -75 130 
             C -75 130 -85 175 -85 220 
             L -85 565 
             C -85 605 -50 625 0 625 
             C 50 625 85 605 85 565 
             L 85 220 
             C 85 175 75 130 75 130 
             Z" 
          fill="url(#silverInnerGrad)" stroke="#e2e8f0" stroke-width="2.5" />

    <!-- Hot Liquid Contents -->
    <path d="M -70 180 
             C -70 200 -80 230 -80 260 
             L -80 555 
             C -80 590 -45 615 0 615 
             C 45 615 80 590 80 555 
             L 80 260 
             C 80 230 70 200 70 180 
             Z" 
          fill="url(#liquidGrad)" />

    <!-- Liquid Surface Meniscus -->
    <ellipse cx="0" cy="180" rx="70" ry="12" fill="#fed7aa" fill-opacity="0.7" stroke="#ea580c" stroke-width="2" />
    
    <!-- Steam / Heat Convection Currents in Liquid -->
    <g opacity="0.65">
      <!-- Convection loops in liquid -->
      <path d="M -35 480 C -50 400 -50 300 -25 240" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="6,4" />
      <polygon points="-25,235 -30,248 -18,245" fill="#fef08a" />

      <path d="M 35 480 C 50 400 50 300 25 240" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="6,4" />
      <polygon points="25,235 18,245 30,248" fill="#fef08a" />

      <path d="M 0 520 C 0 440 0 350 0 240" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4,4" />
      <polygon points="0,230 -6,242 6,242" fill="#ffffff" />
    </g>

    <text x="0" y="380" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.5">HOT LIQUID</text>
    <text x="0" y="400" fill="#fed7aa" font-size="11" font-weight="500" text-anchor="middle">(Thermal Energy)</text>

    <!-- Radiation Reflection Rays inside Vacuum Gap -->
    <!-- Left Silvered Wall reflection -->
    <g stroke="#fde047" stroke-width="2" filter="url(#neonGlow)">
      <polyline points="-70,300 -80,315 -68,330" fill="none" />
      <polyline points="70,330 80,345 68,360" fill="none" />
    </g>

    <!-- Bottom Shock Absorber Spring / Rubber Support -->
    <g transform="translate(0, 645)">
      <!-- Rubber Pad -->
      <rect x="-40" y="0" width="80" height="12" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5" />
      <!-- Metal Spring -->
      <path d="M -25 12 Q 0 16 25 12 Q -25 20 25 20 Q -25 24 0 24" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Vacuum Seal Tip at Base (where air was pumped out) -->
    <path d="M -8 645 L 0 658 L 8 645 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
  </g>

  <!-- ANNOTATION CALLOUTS & EXPLANATIONS -->

  <!-- 1. Insulated Stopper (Top Left) -->
  <g transform="translate(50, 110)">
    <rect width="240" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="16" cy="20" r="10" fill="#f59e0b" />
    <text x="16" y="24" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle">1</text>
    <text x="34" y="22" fill="#fbbf24" font-size="13" font-weight="700">Insulated Stopper</text>
    <text x="12" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Made of cork or plastic (bad conductor).</text>
    <text x="12" y="60" fill="#38bdf8" font-size="10.5" font-weight="600">✓ Prevents CONDUCTION &amp; CONVECTION</text>
    <!-- Pointer Line -->
    <path d="M 240 37 L 335 130" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="335" cy="130" r="3.5" fill="#f59e0b" />
  </g>

  <!-- 2. Silvered Glass Surfaces (Top Right) -->
  <g transform="translate(560, 220)">
    <rect width="250" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="20" r="10" fill="#38bdf8" />
    <text x="16" y="24" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle">2</text>
    <text x="34" y="22" fill="#38bdf8" font-size="13" font-weight="700">Silvered Inner Surfaces</text>
    <text x="12" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Highly polished mirror-like silver coating.</text>
    <text x="12" y="60" fill="#cbd5e1" font-size="11" font-weight="400">Reflects radiant heat back inside.</text>
    <text x="12" y="76" fill="#4ade80" font-size="10.5" font-weight="600">✓ Minimizes RADIATION</text>
    <!-- Pointer Line -->
    <path d="M 0 45 L -100 240" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="-100" cy="240" r="3.5" fill="#38bdf8" />
  </g>

  <!-- 3. High Vacuum Gap (Middle Left) -->
  <g transform="translate(40, 340)">
    <rect width="250" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="16" cy="20" r="10" fill="#a855f7" />
    <text x="16" y="24" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle">3</text>
    <text x="34" y="22" fill="#c084fc" font-size="13" font-weight="700">High Vacuum Gap</text>
    <text x="12" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Space between double walls has NO air.</text>
    <text x="12" y="60" fill="#cbd5e1" font-size="11" font-weight="400">Needs material medium for heat flow.</text>
    <text x="12" y="76" fill="#f43f5e" font-size="10.5" font-weight="600">✓ STOPS Conduction &amp; Convection</text>
    <!-- Pointer Line -->
    <path d="M 250 45 L 290 400" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="290" cy="400" r="3.5" fill="#a855f7" />
  </g>

  <!-- 4. Double Glass Vessel (Middle Right) -->
  <g transform="translate(560, 480)">
    <rect width="250" height="75" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="16" cy="20" r="10" fill="#06b6d4" />
    <text x="16" y="24" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle">4</text>
    <text x="34" y="22" fill="#22d3ee" font-size="13" font-weight="700">Double-Walled Glass</text>
    <text x="12" y="44" fill="#cbd5e1" font-size="11" font-weight="400">Glass is an insulator (poor conductor).</text>
    <text x="12" y="62" fill="#38bdf8" font-size="10.5" font-weight="600">✓ Reduces heat CONDUCTION</text>
    <!-- Pointer Line -->
    <path d="M 0 37 L -90 490" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="-90" cy="490" r="3.5" fill="#06b6d4" />
  </g>

  <!-- 5. Protective Case & Shock Absorber (Bottom Left) -->
  <g transform="translate(40, 680)">
    <rect width="250" height="85" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <circle cx="16" cy="20" r="10" fill="#64748b" />
    <text x="16" y="24" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle">5</text>
    <text x="34" y="22" fill="#cbd5e1" font-size="13" font-weight="700">Shock Absorber &amp; Casing</text>
    <text x="12" y="44" fill="#94a3b8" font-size="11" font-weight="400">Spring and rubber pad support delicate</text>
    <text x="12" y="58" fill="#94a3b8" font-size="11" font-weight="400">glass bottle from physical vibrations.</text>
    <text x="12" y="74" fill="#e2e8f0" font-size="10.5" font-weight="600">✓ Prevents mechanical breakage</text>
    <!-- Pointer Line -->
    <path d="M 250 42 L 360 740" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="360" cy="740" r="3.5" fill="#64748b" />
  </g>

  <!-- Bottom Summary Card -->
  <g transform="translate(320, 800)">
    <rect width="490" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="245" y="22" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">KEY ICSE EXAM PRINCIPLE</text>
    <text x="245" y="42" fill="#f8fafc" font-size="11.5" font-weight="400" text-anchor="middle">"A thermos flask keeps hot things hot &amp; cold things cold by minimizing</text>
    <text x="245" y="60" fill="#4ade80" font-size="11.5" font-weight="700" text-anchor="middle">all three modes of heat transfer: Conduction, Convection &amp; Radiation."</text>
  </g>
</svg>
